version: "3.9"
services:
    product-service:
        container_name: product-service
        image: product-service
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8081:8081"
        environment:
            - SPRING_PROFILES_ACTIVE=dev
            - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-server:29092
        depends_on:
            mongo_database:
                condition: service_healthy
        networks:
            - application-network

    mongo_database:
        image: mongodb/mongodb-community-server
        container_name: mongo_database
        ports:
            - "27017:27017"
        networks:
            - application-network
        environment:
            MONGO_INITDB_ROOT_USERNAME: mlisena
            MONGO_INITDB_ROOT_PASSWORD: A8424628
        volumes:
            - ./database/mongo-init:/docker-entrypoint-initdb.d
            - mongo_database_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
            interval: 10s
            retries: 5
            start_period: 30s

    redis:
        image: redis:7.2-alpine
        container_name: redis
        networks:
            - application-network
        ports:
            - "6379:6379"
        restart: always

networks:
    application-network:
        external: true

volumes:
    mongo_database_data: